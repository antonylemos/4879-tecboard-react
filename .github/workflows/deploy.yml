name: Deploy
on:
  push:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy
        run: pnpm dlx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

  post-deploy-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Health check
        id: health
        run: |
          echo "⚠️ Simulando falha no health check..."
          echo "failures=3" >> $GITHUB_OUTPUT

      - name: Content validation
        id: content
        run: |
          echo "⚠️ Simulando falha na validação de conteúdo..."
          echo "valid=false" >> $GITHUB_OUTPUT

      - name: Auto-rollback
        if: steps.health.outputs.failures > 0 || steps.content.outputs.valid == 'false'
        run: |
          echo "🚨 Rollback no Vercel..."
          pnpm dlx vercel rollback --yes --token=${{ secrets.VERCEL_TOKEN }}
